# FAQAT call.devflix.uz — boshqa server_name / conf fayllariga tegilmaydi.
# Upstream: web 13100, api 14100, asterisk WSS 18089 (hammasi 127.0.0.1)

upstream aicc_call_web {
    server 127.0.0.1:13100;
    keepalive 16;
}

upstream aicc_call_api {
    server 127.0.0.1:14100;
    keepalive 32;
}

upstream aicc_call_asterisk_wss {
    server 127.0.0.1:18089;
}

server {
    listen 80;
    listen [::]:80;
    server_name call.devflix.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name call.devflix.uz;

    # Certbot keyin to'ldiradi; birinchi marta HTTP-01 dan keyin ssl_certificate qo'shiladi.
    ssl_certificate     /etc/letsencrypt/live/call.devflix.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.devflix.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # REST API
    location /api/ {
        proxy_pass http://aicc_call_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Socket.IO (namespace /realtime)
    location /socket.io/ {
        proxy_pass http://aicc_call_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Asterisk WebRTC signaling (SIP.js)
    location /asterisk/ws {
        proxy_pass http://aicc_call_asterisk_wss/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://aicc_call_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# FAQAT call.devflix.uz — boshqa server_name / conf fayllariga tegilmaydi.
# Upstream: web 13100, api 14100, asterisk HTTP WS 18088 (TLS nginx da)

upstream aicc_call_web {
    server 127.0.0.1:13100;
    keepalive 16;
}

upstream aicc_call_api {
    server 127.0.0.1:14100;
    keepalive 32;
}

upstream aicc_call_asterisk_ws {
    # Aniq HTTP (8088) — TLS ni nginx yakunlaydi (8089 self-signed emas).
    server 127.0.0.1:18088;
}

limit_req_zone $binary_remote_addr zone=aicc_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aicc_api:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=aicc_ws:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=aicc_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name call.devflix.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name call.devflix.uz;

    ssl_certificate     /etc/letsencrypt/live/call.devflix.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.devflix.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 10m;
    limit_conn aicc_conn 40;

    # Security headers (har location da — nginx inheritance tuzog'idan qochish)
    set $aicc_csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://call.devflix.uz https://call.devflix.uz; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Auth — qattiq rate limit
    location /api/v1/auth/ {
        limit_req zone=aicc_login burst=10 nodelay;
        proxy_pass http://aicc_call_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $aicc_csp always;
    }

    location /api/ {
        limit_req zone=aicc_api burst=80 nodelay;
        proxy_pass http://aicc_call_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $aicc_csp always;
    }

    location /socket.io/ {
        limit_req zone=aicc_ws burst=40 nodelay;
        limit_conn aicc_conn 20;
        proxy_pass http://aicc_call_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $aicc_csp always;
    }

    # Asterisk WebRTC signaling — nginx TLS, ichkarida aniq HTTP ARI/WS
    location /asterisk/ws {
        limit_req zone=aicc_ws burst=20 nodelay;
        limit_conn aicc_conn 15;
        proxy_pass http://aicc_call_asterisk_ws/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://aicc_call_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy $aicc_csp always;
    }
}

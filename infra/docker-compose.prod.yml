# Faqat call.devflix.uz — boshqa saytlarga tegmaydi.
# Portlar 127.0.0.1 ga bog'langan (izolatsiya).
name: aicc-call

services:
  postgres:
    image: postgres:17-alpine
    container_name: aicc-call-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - aicc_call_pg:/var/lib/postgresql/data
    networks: [aicc_call_net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aicc-call-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD}',
      ]
    volumes:
      - aicc_call_redis:/data
    networks: [aicc_call_net]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: aicc-call-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - aicc_call_minio:/data
    networks: [aicc_call_net]

  minio-init:
    image: minio/mc:latest
    container_name: aicc-call-minio-init
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo bucket_ok
      "
    networks: [aicc_call_net]
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: aicc-call-api
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      TELEPHONY_INTERNAL_URL: http://telephony:4100/internal
      PUBLIC_API_URL: https://call.devflix.uz
      CORS_ORIGINS: https://call.devflix.uz
      RECORDING_SPOOL_DIR: /data/recordings
      API_PORT: '4000'
    volumes:
      - aicc_call_recordings:/data/recordings
    ports:
      - '127.0.0.1:14100:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [aicc_call_net]
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4000/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://call.devflix.uz
    container_name: aicc-call-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:13100:3000'
    depends_on:
      - api
    networks: [aicc_call_net]

  telephony:
    build:
      context: ..
      dockerfile: apps/telephony/Dockerfile
    container_name: aicc-call-telephony
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ARI_URL: http://asterisk:8088
      TELEPHONY_PORT: '4100'
      AUDIOSOCKET_HOST: ai-worker
      AUDIOSOCKET_PORT: '8090'
    ports:
      - '127.0.0.1:14101:4100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [aicc_call_net]

  ai-worker:
    build:
      context: ..
      dockerfile: apps/ai-worker/Dockerfile
    container_name: aicc-call-ai-worker
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AI_WORKER_PORT: '4200'
      AUDIOSOCKET_PORT: '8090'
      # OPENAI_* va STT_* `.env.prod` dan keladi (env_file)
    ports:
      - '127.0.0.1:14102:4200'
      - '127.0.0.1:18090:8090'
    depends_on:
      redis:
        condition: service_healthy
    networks: [aicc_call_net]

  # Softfon uchun. SIP/RTP ochiq emas — faqat localhost ARI/WSS (boshqa dasturlarga xavfsiz).
  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: aicc-call-asterisk
    restart: unless-stopped
    environment:
      ARI_USER: ${ARI_USER}
      ARI_PASSWORD: ${ARI_PASSWORD}
    volumes:
      - ./asterisk/config:/etc/asterisk:rw
      - aicc_call_recordings:/var/spool/asterisk/recording:rw
      - aicc_call_asterisk_logs:/var/log/asterisk
    ports:
      - '127.0.0.1:18088:8088'
      - '127.0.0.1:18089:8089'
    networks: [aicc_call_net]
    healthcheck:
      test: ['CMD-SHELL', 'asterisk -rx "core show version" || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  aicc_call_net:
    name: aicc_call_net
    driver: bridge

volumes:
  aicc_call_pg:
  aicc_call_redis:
  aicc_call_minio:
  aicc_call_recordings:
  aicc_call_asterisk_logs:

# Faqat call.devflix.uz — boshqa saytlarga tegmaydi.
# Portlar 127.0.0.1 ga bog'langan (izolatsiya).
name: aicc-call

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    container_name: aicc-call-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - aicc_call_pg:/var/lib/postgresql/data
    networks: [aicc_call_net]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ['no-new-privileges:true']

  redis:
    image: redis:7-alpine
    container_name: aicc-call-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    volumes:
      - aicc_call_redis:/data
    networks: [aicc_call_net]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768M }
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ['no-new-privileges:true']

  minio:
    # Volume xl-meta v3: eski RELEASE pin formatni o'qiy olmaydi.
    # Pin qilganda faqat joriy volume yozgan versiyadan yangiroq tag tanlang.
    image: minio/minio:latest
    container_name: aicc-call-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - aicc_call_minio:/data
    networks: [aicc_call_net]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null || wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ['no-new-privileges:true']

  minio-init:
    image: minio/mc:latest
    container_name: aicc-call-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc version enable local/$$S3_BUCKET || true &&
      echo bucket_ok
      "
    networks: [aicc_call_net]
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: aicc-call-api
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      TELEPHONY_INTERNAL_URL: http://telephony:4100/internal
      PUBLIC_API_URL: https://call.devflix.uz
      CORS_ORIGINS: https://call.devflix.uz
      RECORDING_SPOOL_DIR: /data/recordings
      API_PORT: '4000'
    volumes:
      - aicc_call_recordings:/data/recordings
    ports:
      - '127.0.0.1:14100:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [aicc_call_net]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1536M }
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4000/api/v1/health\").then(async r=>{const j=await r.json();process.exit(r.ok&&j.status===\"ok\"?0:1)}).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 50s
    security_opt: ['no-new-privileges:true']

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://call.devflix.uz
    container_name: aicc-call-web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:13100:3000'
    depends_on:
      api:
        condition: service_healthy
    networks: [aicc_call_net]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768M }
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: ['no-new-privileges:true']

  telephony:
    build:
      context: ..
      dockerfile: apps/telephony/Dockerfile
    container_name: aicc-call-telephony
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ARI_URL: http://asterisk:8088
      TELEPHONY_PORT: '4100'
      AUDIOSOCKET_HOST: ai-worker
      AUDIOSOCKET_PORT: '8090'
    ports:
      - '127.0.0.1:14101:4100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asterisk:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    networks: [aicc_call_net]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1G }
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4100/internal/telephony/health\").then(async r=>{const j=await r.json();process.exit(r.ok&&j.healthy?0:1)}).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt: ['no-new-privileges:true']

  ai-worker:
    build:
      context: ..
      dockerfile: apps/ai-worker/Dockerfile
    container_name: aicc-call-ai-worker
    restart: unless-stopped
    init: true
    env_file: [.env.prod]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AI_WORKER_PORT: '4200'
      AUDIOSOCKET_PORT: '8090'
      # AudioSocket faqat Docker tarmog'ida — host port YO'Q
    # ports: faqat debug uchun HTTP health (localhost)
    ports:
      - '127.0.0.1:14102:4200'
    depends_on:
      redis:
        condition: service_healthy
    networks: [aicc_call_net]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1536M }
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4200/internal/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: ['no-new-privileges:true']

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: aicc-call-asterisk
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      ARI_USER: ${ARI_USER}
      ARI_PASSWORD: ${ARI_PASSWORD}
      ARI_REQUIRE_STRONG: '1'
      NODE_ENV: production
      ASTERISK_SIP_DOMAIN: ${ASTERISK_SIP_DOMAIN:-call.devflix.uz}
      ASTERISK_PUBLIC_IP: ${ASTERISK_PUBLIC_IP:-87.192.230.208}
      GSM_GATEWAY_PASSWORD: ${GSM_GATEWAY_PASSWORD:-}
      ASTERISK_ENABLE_DEV_EXTRAS: '0'
    volumes:
      - ./asterisk/config:/etc/asterisk:rw
      - aicc_call_recordings:/var/spool/asterisk/recording:rw
      - aicc_call_asterisk_logs:/var/log/asterisk
    ports:
      - '127.0.0.1:18088:8088'
      - '127.0.0.1:18089:8089'
      # WebRTC / media (DTLS-SRTP) — host firewall faqat kerakli IP ga ochilsin
      - '10000-10100:10000-10100/udp'
    networks: [aicc_call_net]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1G }
    healthcheck:
      test: ['CMD-SHELL', 'asterisk -rx "core show version" || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    security_opt: ['no-new-privileges:true']

networks:
  aicc_call_net:
    name: aicc_call_net
    driver: bridge

volumes:
  aicc_call_pg:
  aicc_call_redis:
  aicc_call_minio:
  aicc_call_recordings:
  aicc_call_asterisk_logs:

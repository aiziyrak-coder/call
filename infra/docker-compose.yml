name: aicc

services:
  postgres:
    image: postgres:17-alpine
    container_name: aicc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aicc}
    ports:
      - '${POSTGRES_PORT:-5442}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aicc} -d ${POSTGRES_DB:-aicc}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aicc-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6389}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: aicc-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-aiccadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-aicc_dev_password}
    ports:
      - '${MINIO_PORT:-9010}:9000'
      - '${MINIO_CONSOLE_PORT:-9011}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Yozuvlar uchun bucket'ni bir marta yaratadi, so'ng to'xtaydi.
  minio-init:
    image: minio/mc:latest
    container_name: aicc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aiccadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aicc_dev_password}
      S3_BUCKET: ${S3_BUCKET:-aicc-recordings}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc version enable local/$$S3_BUCKET &&
      echo 'bucket tayyor: '$$S3_BUCKET
      "
    restart: 'no'

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: aicc-asterisk
    restart: unless-stopped
    # SIP/RTP uchun host tarmog'i eng barqarori, ammo Docker Desktop (Windows/macOS)
    # host networking'ni to'liq qo'llab-quvvatlamaydi, shuning uchun portlar ochiq beriladi.
    ports:
      - '5060:5060/udp'
      - '5060:5060/tcp'
      - '8088:8088/tcp' # ARI (HTTP + WebSocket)
      - '8089:8089/tcp' # WSS - brauzer WebRTC signalizatsiyasi
      - '10000-10100:10000-10100/udp' # RTP
    environment:
      ARI_USER: ${ARI_USER:-aicc}
      ARI_PASSWORD: ${ARI_PASSWORD:-aicc_ari_password}
    volumes:
      - ./asterisk/config:/etc/asterisk:rw
      - ./asterisk/certs:/etc/asterisk/keys:rw
      # ARI yozuvlari /var/spool/asterisk/recording ga tushadi; API shu katalogdan
      # o'qib MinIO ga yuklaydi, shuning uchun bind mount ishlatilgan.
      - ./data/recordings:/var/spool/asterisk/recording:rw
      - asterisk-logs:/var/log/asterisk
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'asterisk -rx "core show version" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # STT motorlari. Ikkalasi ham profil ortida - kerakligini tanlang:
  #   docker compose --profile stt-whisper up -d
  #   docker compose --profile stt-gigaam  up -d
  # ---------------------------------------------------------------------------
  whisper-live:
    image: hwdsl2/whisper-live:latest
    container_name: aicc-whisper-live
    profiles: ['stt-whisper']
    restart: unless-stopped
    environment:
      WHISPERLIVE_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPERLIVE_LANGUAGE: ${STT_LANGUAGE:-ru}
    ports:
      - '${WHISPER_WS_PORT:-9190}:9090' # WebSocket streaming
      - '${WHISPER_HTTP_PORT:-8010}:8000' # OpenAI-mos REST
    volumes:
      - whisper-models:/root/.cache

  gigastt:
    build:
      context: ./gigastt
      dockerfile: Dockerfile
    container_name: aicc-gigastt
    profiles: ['stt-gigaam']
    restart: unless-stopped
    ports:
      - '9876:9876'
    volumes:
      - gigaam-models:/models
    environment:
      GIGASTT_MODEL_DIR: /models

volumes:
  postgres-data:
  redis-data:
  minio-data:
  asterisk-logs:
  whisper-models:
  gigaam-models:

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088

; Brauzerdagi WebRTC signalizatsiyasi WSS orqali ketadi (DTLS-SRTP majburiy).
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/asterisk.pem
tlsprivatekey = /etc/asterisk/keys/asterisk.key

; ARI so'rovlari uchun ruxsat berilgan manbalar.
; Ishlab chiqarishda aniq domenga cheklang.

;==============================================================================
; AiCC PJSIP konfiguratsiyasi
;
; Uch xil ulanish turi mavjud:
;   1. operator-*  — brauzerdagi WebRTC softfon (WSS + DTLS-SRTP)
;   2. gsm-gateway — SIM -> SIP shlyuzi (Yeastar TG / Dinstar UC2000 / GoIP)
;   3. pstn-sim    — apparatsiz sinash uchun softfon (MicroSIP/Zoiper)
;
; Operator endpointlari `pjsip_endpoints.conf` da bo'lib, ular bazadagi
; foydalanuvchilardan `pnpm --filter @aicc/telephony run provision` bilan
; qayta generatsiya qilinadi.
;==============================================================================

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; Brauzer faqat WSS orqali ulanadi.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089

;------------------------------------------------------------------------------
; Shablonlar
;------------------------------------------------------------------------------

; Operator softfoni: `webrtc=yes` ICE, DTLS-SRTP, AVPF va rtcp-mux ni birdaniga yoqadi.
[webrtc-endpoint](!)
type = endpoint
context = from-operator
disallow = all
; opus — brauzer uchun eng sifatli; ulaw GSM tomoni bilan moslik uchun.
allow = opus,ulaw,alaw
webrtc = yes
use_avpf = yes
media_encryption = dtls
dtls_auto_generate_cert = yes
ice_support = yes
media_use_received_transport = yes
rtcp_mux = yes
direct_media = no
force_rport = yes
rewrite_contact = yes
; Suhbat AI ga yuborilishi uchun media Asterisk orqali o'tishi shart.
send_pai = yes
tos_audio = ef
cos_audio = 5

[webrtc-aor](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

[webrtc-auth](!)
type = auth
auth_type = userpass

;------------------------------------------------------------------------------
; GSM-shlyuz trunki (asosiy media yo'li)
;
; Shlyuzni "SIP trunk / peer" rejimida sozlang va uni shu Asterisk ga
; ro'yxatdan o'tkazing yoki IP bo'yicha ishonchli qiling.
;------------------------------------------------------------------------------

[gsm-gateway]
type = endpoint
context = from-gsm
disallow = all
; Shlyuzlar odatda G.711 va G.729 ni beradi; VoLTE da G.722 ham bo'lishi mumkin.
allow = alaw,ulaw,g722
direct_media = no
force_rport = yes
rewrite_contact = yes
aors = gsm-gateway
; Shlyuz autentifikatsiya talab qilsa, quyidagi ikki qatorni yoqing:
; outbound_auth = gsm-gateway-auth
; from_user = aicc
language = ru

[gsm-gateway]
type = aor
; Shlyuzning lokal tarmoqdagi IP manzili — .env dagi GSM_GATEWAY_BASE_URL bilan bir xil host.
contact = sip:192.168.1.100:5060
qualify_frequency = 60

[gsm-gateway]
type = identify
endpoint = gsm-gateway
match = 192.168.1.100

[gsm-gateway-auth]
type = auth
auth_type = userpass
username = aicc
password = change_me_gateway_password

;------------------------------------------------------------------------------
; Apparatsiz sinash uchun "PSTN simulyatori".
; MicroSIP/Zoiper ni shu hisob bilan ulang va operatorga qo'ng'iroq qiling —
; u tashqi mijoz kabi ko'rinadi.
;------------------------------------------------------------------------------

[pstn-sim]
type = endpoint
context = from-gsm
disallow = all
allow = ulaw,alaw,opus
auth = pstn-sim
aors = pstn-sim
direct_media = no
force_rport = yes
rewrite_contact = yes
callerid = Test Mijoz <+998900000001>
language = ru

[pstn-sim]
type = auth
auth_type = userpass
username = pstn-sim
password = pstn_sim_dev

[pstn-sim]
type = aor
max_contacts = 2
remove_existing = yes

#include pjsip_endpoints.conf

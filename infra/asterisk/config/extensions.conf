;==============================================================================
; AiCC dialplan
;
; Dialplan ataylab minimal: butun marshrutlash mantiqi ARI ilovasida
; (`apps/telephony`) turadi, shunda navbatlar, IVR va AI ssenariylari
; Asterisk ni qayta yuklamasdan o'zgartiriladi.
;==============================================================================

[globals]
STASIS_APP = aicc

[general]
static = yes
writeprotect = yes

;------------------------------------------------------------------------------
; Kiruvchi: GSM-shlyuz yoki test softfoni
;------------------------------------------------------------------------------
[from-gsm]
exten => _X.,1,NoOp(AiCC kiruvchi: ${CALLERID(num)} -> ${EXTEN})
    same => n,Set(CHANNEL(language)=ru)
    same => n,Set(__AICC_DIRECTION=inbound)
    same => n,Set(__AICC_TRUNK=${CHANNEL(endpoint)})
    same => n,Stasis(${STASIS_APP},inbound,${EXTEN})
    same => n,Hangup()

; Raqamsiz (anonim) kiruvchi qo'ng'iroqlar ham qabul qilinadi.
exten => s,1,Goto(from-gsm,_X.,1)

exten => h,1,NoOp(AiCC kiruvchi tugadi: ${HANGUPCAUSE})

;------------------------------------------------------------------------------
; Chiquvchi: brauzerdagi operator softfoni
;------------------------------------------------------------------------------
[from-operator]
; Ichki qo'ng'iroq: operatordan operatorga (4 xonali raqam).
exten => _1XXX,1,NoOp(AiCC ichki: ${CALLERID(num)} -> ${EXTEN})
    same => n,Set(__AICC_DIRECTION=internal)
    same => n,Stasis(${STASIS_APP},internal,${EXTEN})
    same => n,Hangup()

; Tashqi qo'ng'iroq: E.164 yoki mahalliy raqam.
exten => _[+0-9].,1,NoOp(AiCC chiquvchi: ${CALLERID(num)} -> ${EXTEN})
    same => n,Set(CHANNEL(language)=ru)
    same => n,Set(__AICC_DIRECTION=outbound)
    same => n,Stasis(${STASIS_APP},outbound,${EXTEN})
    same => n,Hangup()

exten => h,1,NoOp(AiCC chiquvchi tugadi: ${HANGUPCAUSE})

;------------------------------------------------------------------------------
; ARI `originate` uchun xizmat konteksti.
; Telephony servisi kanalni shu yerga tashlaydi va darhol Stasis ga oladi.
;------------------------------------------------------------------------------
[aicc-originate]
exten => _.,1,NoOp(AiCC originate: ${EXTEN})
    same => n,Stasis(${STASIS_APP},originated,${EXTEN})
    same => n,Hangup()

;------------------------------------------------------------------------------
; Chiquvchi qo'ng'iroqni GSM-shlyuzga uzatish (ARI `Dial` o'rniga ishlatilsa).
;------------------------------------------------------------------------------
[to-gsm]
exten => _[+0-9].,1,NoOp(GSM shlyuziga: ${EXTEN})
    same => n,Dial(PJSIP/${EXTEN}@gsm-gateway,60,tT)
    same => n,Hangup()
